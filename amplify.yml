version: 1
# AWS Amplify Hosting build spec for the ProSellerOS Copilot (Next.js 15 SSR).
#
# Platform: Amplify auto-detects Next.js SSR (WEB_COMPUTE) because next.config.ts
# does NOT set `output: "export"`. The /api/* routes run on the Amplify compute
# (managed Lambda) — so the compute role needs Bedrock + S3 permissions.
#
# Set env vars (COCKROACH_DSN, AWS_REGION, BEDROCK_*, S3_BUCKET, GEMINI_*) in the
# Amplify console -> App settings -> Environment variables. They are available at
# build AND to the SSR compute at runtime. Node version is pinned via .nvmrc (20).
#
# Grant Bedrock/S3 to the compute role: see infra/amplify-compute-policy.json and
# the full runbook in docs/DEPLOY.md.
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify does NOT pass console environment variables to the Next.js
        # server runtime — they exist only in the build environment, and server
        # components see nothing. Writing them to .env.production is the
        # documented way to make them readable at request time:
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        #
        # No `|| true` here on purpose: if this matches nothing the build should
        # fail loudly, because the alternative is a green deploy that silently
        # serves mock data (the assistant route swallows backend errors).
        - env | grep -E '^(AI_PROVIDER|COCKROACH_DSN|EMBED_DIMS|S3_BUCKET|APP_AWS_REGION|GCP_SA_KEY|GEMINI_[A-Z_]+|GOOGLE_CLOUD_[A-Z_]+)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .next/cache/**/*
